# Copy to samconfig.toml (git-ignored) and adjust. Used by `sam build` / `sam deploy`.
version = 0.1

[default.global.parameters]
stack_name = "serverless-notes-dev"
# eu-north-1 (Stockholm) is the project region (docs/decisions/README.md, ADR 0008). To deploy
# elsewhere, change this value AND export AWS_REGION to the same region so the helper scripts
# follow it.
region = "eu-north-1"
# profile = "<your AWS CLI profile>"   # optional; otherwise AWS_PROFILE / default credentials

[default.build.parameters]
template_file = "template.yaml"
cached = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
confirm_changeset = true
fail_on_empty_changeset = false
parameter_overrides = [
  "Stage=dev",
  "AllowedOrigin=http://localhost:5173",
  "CallbackUrls=http://localhost:5173/auth/callback",
  "LogoutUrls=http://localhost:5173/",
  "LogRetentionDays=14",
  "EnableScopeTestClient=true",
]
tags = "Project=serverless-notes Stage=dev"
