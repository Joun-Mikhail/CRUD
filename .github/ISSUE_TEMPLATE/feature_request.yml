name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or hard to do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: impact
    attributes:
      label: Security, cost or thesis impact
      description: Does this change the API contract, IAM permissions, AWS cost, or anything the thesis describes?
