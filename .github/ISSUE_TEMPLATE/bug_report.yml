name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For security problems, use Security → Report a vulnerability instead of a public issue.
  - type: dropdown
    id: mode
    attributes:
      label: Where did it happen?
      options:
        - Local Demo (make demo-backend / demo-frontend)
        - Deployed on AWS
        - CI / tests
        - Documentation
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …\n3. …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
      description: Include the HTTP status, the error `code` and the `requestId` if there was an API error.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: e.g. main @ abc1234, or the version shown on the Settings page
