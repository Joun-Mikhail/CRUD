name: Deploy (manual)

# Never runs automatically. A person starts it from the Actions tab, and the job only
# proceeds after the reviewers configured on the chosen GitHub Environment approve it.
#
# One-time setup (see docs/deployment/DEPLOYMENT.md, "GitHub Actions deployment"):
#   1. In AWS, create an IAM OIDC identity provider for token.actions.githubusercontent.com
#      and a role whose trust policy only allows this repository + environment.
#   2. In GitHub: Settings > Environments > create "dev" with required reviewers, and add
#      the environment variable AWS_DEPLOY_ROLE_ARN (a role ARN is an identifier, not a secret).
# No long-lived AWS access keys are stored anywhere.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment (and stack stage) to deploy
        type: choice
        options: [dev]
        default: dev
      target:
        description: What to deploy (api = SAM stack + live tests; frontend = build + publish to S3/CloudFront)
        type: choice
        options: [api, frontend]
        default: api

permissions:
  id-token: write # required to request the OIDC token
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.target == 'api'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: eu-north-1
      STACK_NAME: serverless-notes-${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install aws-sam-cli cfn-lint -e 'backend[dev]'
      - name: Tests must pass before anything is deployed
        run: pytest
        working-directory: backend
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: aws sts get-caller-identity
      - run: sam validate -t infrastructure/template.yaml
      - run: sam validate --lint -t infrastructure/template.yaml
      - run: sam build -t infrastructure/template.yaml
      - name: Deploy
        run: >
          sam deploy
          --stack-name "$STACK_NAME"
          --region "$AWS_REGION"
          --capabilities CAPABILITY_IAM
          --resolve-s3
          --no-confirm-changeset
          --no-fail-on-empty-changeset
          --parameter-overrides Stage=${{ inputs.environment }} EnableScopeTestClient=true
          --tags Project=serverless-notes Stage=${{ inputs.environment }}
      - name: Live acceptance and security tests
        run: python scripts/testing/live_api_tests.py --stack-name "$STACK_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-test-evidence
          path: evidence/tests/live-api-tests.json

  # Builds the frontend for its CloudFront origin and publishes it to the private site bucket.
  # Uses a separate least-privilege role (vars.AWS_FRONTEND_ROLE_ARN): DescribeStacks on the two
  # stacks, ListBucket/PutObject/DeleteObject on the site bucket, CreateInvalidation on the
  # distribution. The role is NOT created yet (docs/deployment/DEPLOYMENT.md), so this job
  # fails at the credentials step until it exists.
  publish-frontend:
    if: inputs.target == 'frontend'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: eu-north-1
      API_STACK: serverless-notes-${{ inputs.environment }}
      WEB_STACK: serverless-notes-${{ inputs.environment }}-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install boto3
      - run: npm ci
        working-directory: frontend
      - name: Tests must pass before anything is published
        run: npm run lint && npm run typecheck && npm test
        working-directory: frontend
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_FRONTEND_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Build and publish
        run: ./scripts/deployment/publish_frontend.sh
        env:
          PYTHON: python
